name: Build Mac Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload the Mac package to
        required: true
        default: v1.0.7

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create macOS icon
        run: |
          mkdir -p assets/panghu-avatar.iconset
          sips -z 16 16 assets/panghu-avatar.png --out assets/panghu-avatar.iconset/icon_16x16.png
          sips -z 32 32 assets/panghu-avatar.png --out assets/panghu-avatar.iconset/icon_16x16@2x.png
          sips -z 32 32 assets/panghu-avatar.png --out assets/panghu-avatar.iconset/icon_32x32.png
          sips -z 64 64 assets/panghu-avatar.png --out assets/panghu-avatar.iconset/icon_32x32@2x.png
          sips -z 128 128 assets/panghu-avatar.png --out assets/panghu-avatar.iconset/icon_128x128.png
          sips -z 256 256 assets/panghu-avatar.png --out assets/panghu-avatar.iconset/icon_128x128@2x.png
          sips -z 256 256 assets/panghu-avatar.png --out assets/panghu-avatar.iconset/icon_256x256.png
          sips -z 512 512 assets/panghu-avatar.png --out assets/panghu-avatar.iconset/icon_256x256@2x.png
          sips -z 512 512 assets/panghu-avatar.png --out assets/panghu-avatar.iconset/icon_512x512.png
          sips -z 1024 1024 assets/panghu-avatar.png --out assets/panghu-avatar.iconset/icon_512x512@2x.png
          iconutil -c icns assets/panghu-avatar.iconset -o assets/panghu-avatar.icns

      - name: Build app
        run: |
          chmod +x scripts/build-mac-app.command
          scripts/build-mac-app.command

      - name: Test built app
        run: |
          release/胖虎AI多Agent一键部署工具.app/Contents/MacOS/胖虎AI多Agent一键部署工具 --self-test

      - name: Prepare release asset
        run: |
          cp release/胖虎AI多Agent一键部署工具-Mac.zip release/AI.Agent.-Mac.zip
          shasum -a 256 release/AI.Agent.-Mac.zip | tee release/AI.Agent.-Mac.zip.sha256
          stat -f "%z" release/AI.Agent.-Mac.zip | tee release/AI.Agent.-Mac.zip.size

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" release/AI.Agent.-Mac.zip --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI.Agent.-Mac
          path: |
            release/AI.Agent.-Mac.zip
            release/AI.Agent.-Mac.zip.sha256
            release/AI.Agent.-Mac.zip.size
