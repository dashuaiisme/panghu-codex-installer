name: Build Mac Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload the Mac package to
        required: true
        default: v1.0.10
      allow_unnotarized_upload:
        description: Allow uploading ad-hoc signed test packages when Apple signing/notarization secrets are missing
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build app
        run: scripts\build-windows-exe.bat

      - name: Test built app
        run: release\胖虎AI多Agent一键部署工具\胖虎AI多Agent一键部署工具.exe --self-test

      - name: Prepare release asset
        shell: pwsh
        run: |
          Copy-Item -LiteralPath 'release\胖虎AI多Agent一键部署工具-Windows.zip' -Destination 'release\AI.Agent.-Windows.zip' -Force
          (Get-FileHash -Algorithm SHA256 -LiteralPath 'release\AI.Agent.-Windows.zip').Hash.ToLowerInvariant() | Set-Content -Encoding ascii 'release\AI.Agent.-Windows.zip.sha256'
          (Get-Item -LiteralPath 'release\AI.Agent.-Windows.zip').Length | Set-Content -Encoding ascii 'release\AI.Agent.-Windows.zip.size'

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release view "$env:RELEASE_TAG"
          gh release upload "$env:RELEASE_TAG" "release/AI.Agent.-Windows.zip" --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI.Agent.-Windows
          path: |
            release/AI.Agent.-Windows.zip
            release/AI.Agent.-Windows.zip.sha256
            release/AI.Agent.-Windows.zip.size

  build-mac:
    name: Build Mac ${{ matrix.package_suffix }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      ALLOW_UNNOTARIZED_UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unnotarized_upload || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            package_suffix: Intel
            expected_arch: x86_64
          - runner: macos-15
            package_suffix: AppleSilicon
            expected_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "${MACOS_CERTIFICATE_BASE64:-}" ] || [ -z "${MACOS_CERTIFICATE_PASSWORD:-}" ] || [ -z "${KEYCHAIN_PASSWORD:-}" ]; then
            echo "Apple Developer ID certificate secrets are not configured; building an ad-hoc signed test package."
            exit 0
          fi
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build app
        env:
          APP_VERSION: ${{ env.RELEASE_TAG }}
          BUNDLE_ID: cc.aitokenapi.panghu.agent-deployer
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        run: |
          chmod +x scripts/build-mac-app.command
          scripts/build-mac-app.command

      - name: Verify architecture
        run: |
          EXECUTABLE="release/胖虎AI多Agent一键部署工具.app/Contents/MacOS/胖虎AI多Agent一键部署工具"
          file "$EXECUTABLE"
          file "$EXECUTABLE" | grep "${{ matrix.expected_arch }}"

      - name: Verify signature
        run: |
          codesign --verify --deep --strict --verbose=2 "release/胖虎AI多Agent一键部署工具.app"
          codesign -dv --verbose=4 "release/胖虎AI多Agent一键部署工具.app" 2>&1

      - name: Test built app
        run: |
          release/胖虎AI多Agent一键部署工具.app/Contents/MacOS/胖虎AI多Agent一键部署工具 --self-test

      - name: Notarize app
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "${MACOS_CERTIFICATE_BASE64:-}" ] || [ -z "${MACOS_CERTIFICATE_PASSWORD:-}" ] || [ -z "${MACOS_KEYCHAIN_PASSWORD:-}" ] || [ -z "${MACOS_CODESIGN_IDENTITY:-}" ] || [ -z "${APPLE_ID:-}" ] || [ -z "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "Apple notarization secrets are not fully configured; skipping notarization."
            echo "notarized=false" >> "$GITHUB_ENV"
            exit 0
          fi
          ZIP_PATH="release/胖虎AI多Agent一键部署工具-Mac-${{ matrix.package_suffix }}.zip"
          xcrun notarytool submit "$ZIP_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "release/胖虎AI多Agent一键部署工具.app"
          rm -f "$ZIP_PATH"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "release/胖虎AI多Agent一键部署工具.app" "$ZIP_PATH"
          spctl --assess --type execute --verbose=4 "release/胖虎AI多Agent一键部署工具.app"
          echo "notarized=true" >> "$GITHUB_ENV"

      - name: Stop before public upload when package is not notarized
        if: ${{ env.notarized != 'true' && env.ALLOW_UNNOTARIZED_UPLOAD != 'true' }}
        run: |
          echo "This Mac package was not notarized, so it will not be uploaded to the public GitHub Release."
          echo "Configure Apple signing/notarization secrets for customer releases, or rerun with allow_unnotarized_upload=true for internal testing."
          exit 1

      - name: Prepare release asset
        run: |
          cp "release/胖虎AI多Agent一键部署工具-Mac-${{ matrix.package_suffix }}.zip" "release/AI.Agent.-Mac-${{ matrix.package_suffix }}.zip"
          shasum -a 256 "release/AI.Agent.-Mac-${{ matrix.package_suffix }}.zip" | tee "release/AI.Agent.-Mac-${{ matrix.package_suffix }}.zip.sha256"
          stat -f "%z" "release/AI.Agent.-Mac-${{ matrix.package_suffix }}.zip" | tee "release/AI.Agent.-Mac-${{ matrix.package_suffix }}.zip.size"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" "release/AI.Agent.-Mac-${{ matrix.package_suffix }}.zip" --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI.Agent.-Mac-${{ matrix.package_suffix }}
          path: |
            release/AI.Agent.-Mac-${{ matrix.package_suffix }}.zip
            release/AI.Agent.-Mac-${{ matrix.package_suffix }}.zip.sha256
            release/AI.Agent.-Mac-${{ matrix.package_suffix }}.zip.size
