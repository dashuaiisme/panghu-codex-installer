<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>胖虎AI客户端</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Share+Tech+Mono&display=swap');

    :root {
      /* Gemini Dark Console Design System - Route F AI Analytics / SaaS Admin Cockpit */
      --g-bg-deep: #04060a;
      --g-bg: #070b12;
      --g-console-bg: #030508;
      --g-surface: #0b101a;
      --g-surface-2: #111726;
      --g-surface-3: #1a2338;
      --g-line: rgba(0, 242, 196, 0.05);
      --g-line-strong: rgba(255, 255, 255, 0.08);

      /* New Audit/Premium Design System Tokens */
      --g-line-glow: rgba(0, 242, 196, 0.15);
      --g-panel-highlight: linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, transparent 100%);
      --g-hairline: 1px solid rgba(255, 255, 255, 0.03);
      --g-scanline: linear-gradient(to bottom, rgba(0, 242, 196, 0.03) 50%, transparent 50%);

      --g-text: #f3f4f6;
      --g-text-inverse: #04060a;
      --g-text-muted: #9ca3af;
      --g-text-subtle: #6b7280;

      --g-primary: #00f2c4; /* Teal-green focus */
      --g-primary-strong: #00b894;
      --g-secondary: #8ab4f8; /* Soft blue support */
      --g-warm: #f6aea9;
      --g-success: #00f2a9;
      --g-warning: #fdd663;
      --g-danger: #f28b82;

      --g-aura: linear-gradient(135deg, #00f2c4 0%, #8ab4f8 52%, #c58af9 100%);
      --g-aura-teal: linear-gradient(135deg, #00f2c4 0%, #00b894 100%);
      --g-shadow-soft: 0 16px 48px rgba(0, 0, 0, 0.7);
      --g-shadow-glow: 0 0 20px rgba(0, 242, 196, 0.12);

      --g-radius-control: 8px;
      --g-radius-card: 12px;
      --g-radius-panel: 16px;

      --g-font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --g-mono: 'Share Tech Mono', Consolas, Monaco, monospace;

      --g-sidebar-width: 250px;
      --g-drawer-height: 290px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      color: var(--g-text);
      font-family: var(--g-font);
      background-color: var(--g-bg);
      position: relative;
    }

    /* Ambient Space Grid (Minimal AI Environment) */
    .gm-space-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-color: var(--g-bg-deep);
      background-image:
        radial-gradient(circle at 10% 10%, rgba(0, 242, 196, 0.05), transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(138, 180, 248, 0.04), transparent 50%),
        radial-gradient(circle at 50% 30%, rgba(197, 138, 249, 0.03), transparent 60%);
      pointer-events: none;
    }

    .gm-space-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: 0.4;
      pointer-events: none;
    }

    .gm-space-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 242, 196, 0.008) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 242, 196, 0.008) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    /* Buttons */
    .gm-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      border: 1px solid var(--g-line-strong);
      border-radius: var(--g-radius-control);
      padding: 0 16px;
      color: var(--g-text);
      background: var(--g-surface-2);
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      gap: 8px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
    }

    .gm-btn:hover {
      border-color: var(--g-primary);
      background: var(--g-surface-3);
      box-shadow: 0 0 12px rgba(0, 242, 196, 0.15);
    }

    .gm-btn:active {
      transform: translateY(0.5px);
    }

    .gm-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: var(--g-line);
      background: var(--g-surface);
      box-shadow: none;
    }

    .gm-btn-primary {
      border: none;
      color: var(--g-text-inverse);
      background: var(--g-aura-teal);
      font-weight: 600;
      box-shadow: var(--g-shadow-glow);
    }

    .gm-btn-primary:hover {
      filter: brightness(1.1);
      box-shadow: 0 0 20px rgba(0, 242, 196, 0.35);
    }

    .gm-glow-btn {
      border: none !important;
      color: var(--g-text-inverse) !important;
      background: var(--g-aura-teal) !important;
      font-weight: 700 !important;
      box-shadow: 0 0 16px rgba(0, 242, 196, 0.3) !important;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .gm-glow-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      transform: translateX(-100%);
      transition: transform 0.8s ease;
    }

    .gm-glow-btn:hover::after {
      transform: translateX(100%);
    }

    .gm-glow-btn:hover {
      box-shadow: 0 0 24px rgba(0, 242, 196, 0.5), 0 0 8px rgba(0, 242, 196, 0.2) !important;
      filter: brightness(1.1);
    }

    .gm-btn-secondary {
      border-color: rgba(0, 242, 196, 0.2);
      color: var(--g-primary);
      background: rgba(0, 242, 196, 0.03);
    }

    .gm-btn-secondary:hover {
      border-color: var(--g-primary);
      background: rgba(0, 242, 196, 0.08);
    }

    .gm-btn-danger {
      border-color: rgba(242, 139, 130, 0.3);
      color: var(--g-danger);
      background: rgba(242, 139, 130, 0.04);
    }

    .gm-btn-danger:hover {
      border-color: var(--g-danger);
      background: rgba(242, 139, 130, 0.08);
    }

    /* Inputs & Selects */
    .gm-input, .gm-select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--g-line-strong);
      border-radius: var(--g-radius-control);
      padding: 0 14px;
      color: var(--g-text);
      background: var(--g-surface-2);
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
    }

    .gm-input:focus, .gm-select:focus {
      border-color: var(--g-primary);
      box-shadow: 0 0 8px rgba(0, 242, 196, 0.2);
      background: var(--g-surface-3);
    }

    .gm-input::placeholder {
      color: var(--g-text-subtle);
    }

    /* Chips */
    .gm-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      color: var(--g-text-muted);
      background: var(--g-surface-2);
      border: 1px solid var(--g-line);
    }

    .gm-chip.ok { color: var(--g-success); border-color: rgba(0, 242, 169, 0.25); background: rgba(0, 242, 169, 0.06); }
    .gm-chip.warn { color: var(--g-warning); border-color: rgba(253, 214, 99, 0.25); background: rgba(253, 214, 99, 0.06); }
    .gm-chip.info { color: var(--g-secondary); border-color: rgba(138, 180, 248, 0.25); background: rgba(138, 180, 248, 0.06); }
    .gm-chip.danger { color: var(--g-danger); border-color: rgba(242, 139, 130, 0.25); background: rgba(242, 139, 130, 0.06); }

    /* Login Gate Layout */
    .gm-login-portal {
      position: relative;
      z-index: 10;
      display: none; /* Controlled by JS */
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .gm-login-card {
      width: min(980px, 95vw);
      min-height: 560px;
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      border-radius: var(--g-radius-panel);
      border: 1px solid var(--g-line);
      border-top: 1px solid var(--g-line-strong);
      background: linear-gradient(135deg, rgba(11, 16, 26, 0.96) 0%, rgba(7, 11, 18, 0.98) 100%);
      box-shadow: var(--g-shadow-soft), inset 0 1px 0 rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(30px);
      overflow: hidden;
      position: relative;
    }

    .gm-login-deco {
      padding: 48px;
      border-right: 1px solid var(--g-line);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: radial-gradient(circle at 20% 20%, rgba(0, 242, 196, 0.08), transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(138, 180, 248, 0.06), transparent 50%);
      position: relative;
      overflow: hidden;
    }

    /* Premium AI Orbit and Aura node */
    .gm-login-aura-core {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 320px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.85;
    }
    .gm-login-aura-core .orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      border: 1px dashed rgba(0, 242, 196, 0.08);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: rotateOrbit 20s linear infinite;
    }
    .gm-login-aura-core .orbit.o1 { width: 260px; height: 260px; animation-duration: 25s; }
    .gm-login-aura-core .orbit.o2 { width: 180px; height: 180px; animation-duration: 15s; animation-direction: reverse; }
    .gm-login-aura-core .orbit.o3 { width: 100px; height: 100px; animation-duration: 8s; }

    .gm-login-aura-core .core-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 70px;
      height: 70px;
      background: var(--g-aura);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      filter: blur(25px);
      opacity: 0.45;
      animation: pulseCore 4s ease-in-out infinite alternate;
    }

    @keyframes rotateOrbit {
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes pulseCore {
      0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.35; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.65; }
    }

    .gm-brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .gm-logo-spark {
      width: 24px;
      height: 24px;
      background: var(--g-aura);
      clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
      animation: rotateSpark 12s linear infinite;
    }

    @keyframes rotateSpark {
      100% { transform: rotate(360deg); }
    }

    .gm-brand-group h2 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      background: linear-gradient(to right, var(--g-text), var(--g-text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gm-login-desc {
      margin-top: 32px;
      margin-bottom: 32px;
    }

    .gm-login-desc h1 {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      background: var(--g-aura);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gm-login-desc p {
      font-size: 13px;
      line-height: 1.6;
      color: var(--g-text-muted);
    }

    .gm-login-features {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: auto;
    }

    .gm-feature-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11.5px;
      color: var(--g-text-muted);
      background: rgba(255, 255, 255, 0.02);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.01);
      transition: all 0.2s ease;
    }

    .gm-feature-item:hover {
      background: rgba(0, 242, 196, 0.02);
      border-color: rgba(0, 242, 196, 0.1);
      color: var(--g-text);
    }

    .gm-feature-item svg {
      width: 14px;
      height: 14px;
      color: var(--g-primary);
      filter: drop-shadow(0 0 3px rgba(0, 242, 196, 0.3));
    }

    .gm-login-form {
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
    }

    .gm-form-header {
      margin-bottom: 4px;
    }

    .gm-form-header h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .gm-form-header p {
      font-size: 12px;
      color: var(--g-text-subtle);
      margin-top: 2px;
    }

    .gm-form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .gm-form-field label {
      font-size: 11px;
      font-weight: 600;
      color: var(--g-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .gm-account-input-wrapper {
      display: grid;
      grid-template-columns: 1fr 40px;
      gap: 6px;
    }

    .gm-saved-list {
      display: none;
      position: absolute;
      width: calc(50% - 50px);
      right: 40px;
      top: 200px;
      border: 1px solid var(--g-line);
      border-radius: var(--g-radius-control);
      background: var(--g-surface-2);
      z-index: 50;
      max-height: 140px;
      overflow-y: auto;
      box-shadow: var(--g-shadow-soft);
    }

    .gm-saved-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid var(--g-line);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .gm-saved-row:hover {
      background: var(--g-surface-3);
    }

    .gm-saved-row span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--g-text-muted);
    }

    .gm-saved-row span:hover {
      color: var(--g-text);
    }

    .gm-saved-row button {
      background: transparent;
      border: none;
      color: var(--g-danger);
      font-size: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .gm-form-checkboxes {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .gm-form-checkboxes label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--g-text-muted);
      cursor: pointer;
    }

    .gm-form-checkboxes input[type="checkbox"] {
      accent-color: var(--g-primary);
    }

    .gm-btn:focus-visible,
    .gm-input:focus-visible,
    .gm-select:focus-visible,
    .gm-dock-btn:focus-visible,
    .gm-sidebar-item:focus-visible,
    .gm-saved-row button:focus-visible,
    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--g-primary);
      outline-offset: 3px;
      box-shadow: 0 0 0 4px rgba(0, 242, 196, 0.12);
    }

    .gm-login-links {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-top: 4px;
    }

    .gm-login-links a {
      color: var(--g-primary);
      text-decoration: none;
      transition: color 0.2s;
      cursor: pointer;
    }

    .gm-login-links a:hover {
      color: var(--g-secondary);
    }

    /* Core Application Window Layout (P1: Top-Primary Module Navigation) */
    .gm-cockpit {
      position: relative;
      z-index: 10;
      display: none; /* Controlled by JS */
      width: 100vw;
      height: 100vh;
      flex-direction: column;
      overflow: hidden;
      background: var(--g-bg);
    }

    /* Top Primary Navigation Header */
    .gm-primary-header {
      height: 64px;
      background: rgba(4, 6, 10, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      z-index: 20;
      flex-shrink: 0;
    }

    .gm-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 180px;
    }

    .gm-header-left h2 {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.01em;
      background: var(--g-aura);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gm-primary-nav {
      display: flex;
      gap: 6px;
      align-items: center;
      height: 100%;
    }

    .gm-dock-btn {
      height: 100%;
      padding: 0 20px;
      border: none;
      background: transparent;
      color: var(--g-text-muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .gm-dock-btn:hover {
      color: var(--g-text);
      background: rgba(255, 255, 255, 0.02);
    }

    .gm-dock-btn.active {
      color: var(--g-primary);
      background: linear-gradient(180deg, rgba(0, 242, 196, 0.03) 0%, transparent 100%);
    }

    .gm-dock-btn::before {
      content: "";
      position: absolute;
      bottom: 0;
      left: 15%;
      width: 70%;
      height: 2px;
      background: var(--g-aura-teal);
      opacity: 0;
      transition: all 0.2s ease;
      border-radius: 99px;
      box-shadow: 0 0 10px var(--g-primary);
    }

    .gm-dock-btn.active::before {
      opacity: 1;
    }

    .gm-dock-btn span:first-child {
      font-size: 13px;
      font-weight: 700;
      display: block;
      text-align: center;
      letter-spacing: -0.01em;
    }

    .gm-dock-btn span:last-child {
      font-size: 8px;
      opacity: 0.5;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: block;
      text-align: center;
    }

    .gm-header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 180px;
      justify-content: flex-end;
    }

    /* P1: Modern Status Hub Component in Top Header */
    .gm-status-hub {
      display: flex;
      gap: 16px;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 99px;
      padding: 4px 18px;
      height: 38px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
    }

    .gm-status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--g-text-muted);
    }

    .gm-status-pill strong {
      color: var(--g-text);
      font-weight: 600;
      font-family: var(--g-mono);
    }

    .gm-status-label {
      color: var(--g-text-subtle);
      font-weight: 500;
    }

    .gm-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--g-success);
      box-shadow: 0 0 8px var(--g-success);
    }

    .gm-status-dot.unsynced {
      background: var(--g-warning);
      box-shadow: 0 0 8px var(--g-warning);
    }

    /* Body Area of Cockpit Layout */
    .gm-cockpit-body {
      display: flex;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    /* Contextual Sidebar Navigation (二级子菜单) */
    .gm-context-sidebar {
      width: var(--g-sidebar-width);
      background: var(--g-bg-deep);
      border-right: 1px solid rgba(255, 255, 255, 0.03);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 15;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .gm-sidebar-subnav-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--g-text-subtle);
      margin-bottom: 16px;
      padding-left: 8px;
    }

    /* Right Main Viewport */
    .gm-main-viewport {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
      flex: 1;
      width: auto;
      background: var(--g-bg);
    }

    .gm-viewport-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      background: var(--g-bg-deep);
    }

    .gm-viewport-header h1 {
      font-size: 16px;
      font-weight: 700;
    }

    .gm-viewport-header p {
      font-size: 11px;
      color: var(--g-text-subtle);
      margin-top: 2px;
    }

    /* Stepper segment bar - Kept hidden for contract compatibility */
    .gm-stepper-container {
      display: none !important;
    }

    /* Vertical Contextual Subnav List inside Sidebar */
    .gm-subnav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      position: relative;
    }

    .gm-subnav-list::before {
      content: "";
      position: absolute;
      left: 27px;
      top: 18px;
      bottom: 18px;
      width: 1px;
      background: rgba(255, 255, 255, 0.04);
      z-index: 0;
      pointer-events: none;
    }

    .gm-timeline-node {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      width: 100%;
      border-radius: var(--g-radius-control);
      background: transparent;
      border: 1px solid transparent;
      color: var(--g-text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      outline: none;

    .gm-timeline-node:hover {
      background: rgba(255, 255, 255, 0.02);
      color: var(--g-text);

    .gm-timeline-node.active {
      background: linear-gradient(90deg, rgba(0, 242, 196, 0.04) 0%, transparent 100%), var(--g-surface-2);
      border-color: rgba(0, 242, 196, 0.1);
      color: var(--g-text);
      box-shadow: inset 2px 0 0 var(--g-primary);
    }

    .gm-node-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--g-line-strong);
      display: grid;
      place-items: center;
      font-size: 10px;
      font-weight: bold;
      transition: all 0.2s;
      background: var(--g-bg-deep);
      flex-shrink: 0;
      z-index: 2;
    }

    .gm-timeline-node.active .gm-node-dot {
      border-color: var(--g-primary);
      background: var(--g-primary);
      color: var(--g-bg-deep);
      box-shadow: var(--g-shadow-glow);
    }

    .gm-timeline-node.done .gm-node-dot {
      border-color: var(--g-success);
      background: rgba(0, 242, 169, 0.1);
      color: var(--g-success);
    }

    .gm-node-label {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--g-text-muted);
    }

    .gm-timeline-node.active .gm-node-label {
      color: var(--g-text);
      font-weight: 700;
    }

    .gm-timeline-sep {
      display: none !important;
    }

    /* Bottom collapsible diagnostic drawer workspace layout (P1: Modern HUD style) */
    .gm-workspace-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      position: relative;
    }

    .gm-workspace-container.collapsed .gm-diagnostics-drawer {
      height: 0px;
      border-top: none;
    }

    .gm-content-pane {
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      flex: 1;
      width: 100%;
      max-width: none;
      height: 100%;

    /* Core visual command card */
    .gm-mission-card {
      background: var(--g-surface);
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: var(--g-radius-panel);
      padding: 28px;
      box-shadow: var(--g-shadow-soft);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: none;
      flex: 1;

    .gm-mission-card::before {
      content: "";
      position: absolute;

      background: var(--g-aura-teal);

    .gm-mission-header {
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      padding-bottom: 16px;
    }

    .gm-canvas-meta {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--g-primary);
      background: rgba(0, 242, 196, 0.08);
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 6px;

    .gm-mission-header h2 {

      font-weight: 800;
      letter-spacing: -0.02em;
      margin-top: 4px;

    .gm-canvas-desc {

      flex-direction: column;

    /* Diagnostics Collapsible Drawer - Restructured to Bottom Command Panel */
    .gm-diagnostics-drawer {
      background: var(--g-surface);
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      border-left: none;
      display: flex;
      flex-direction: column;

      height: var(--g-drawer-height);

    .gm-drawer-tabs {
      display: flex;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      background: var(--g-bg-deep);
    }

    .gm-drawer-tab {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: none;
      color: var(--g-text-subtle);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;

    .gm-drawer-tab:hover {
      color: var(--g-text);
      background: rgba(255, 255, 255, 0.02);
    }

    .gm-drawer-tab.active {
      color: var(--g-primary);
      border-bottom-color: var(--g-primary);
      background: rgba(255, 255, 255, 0.01);
    }

    .gm-drawer-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .gm-drawer-content.scrollable {
      overflow-y: auto;
    }

    .gm-drawer-content.hidden {
      display: none !important;
    }

    /* Diagnostics Area Style (P1: Modern Asymmetric Grid) */
    #deliveryInspector {
      padding: 20px 24px;
      display: grid;
      grid-template-columns: 1.2fr 2fr 1.5fr;
      gap: 24px;
    }

    .gm-inspector-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .gm-inspector-col h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--g-text-subtle);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      padding-bottom: 6px;
      margin-bottom: 8px;

    .gm-inspector-kv {
      display: flex;
      flex-direction: column;
      gap: 8px;

    .gm-inspector-kv div {
      display: flex;
      justify-content: space-between;

      color: var(--g-text-subtle);
    }

    .gm-inspector-kv span:last-child {
      font-weight: 500;
      color: var(--g-text-muted);
    }

    .gm-matrix {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .gm-matrix-header {
      display: grid;
      grid-template-columns: 90px repeat(5, 1fr);

      font-weight: bold;
      color: var(--g-text-subtle);
      text-align: center;
      margin-bottom: 2px;

    .gm-matrix-header span:first-child {
      text-align: left;
    }

    .gm-matrix-row {
      display: grid;
      grid-template-columns: 90px repeat(5, 1fr);
      align-items: center;
      gap: 4px;
    }

    .gm-matrix-row strong {
      font-size: 11px;
      color: var(--g-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .gm-matrix-pill {
      height: 18px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: bold;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--g-text-subtle);
      background: rgba(255, 255, 255, 0.01);
      font-family: var(--g-mono);
    }

    .gm-matrix-pill.ok {
      color: var(--g-success);
      background: rgba(0, 242, 169, 0.06);
      border-color: rgba(0, 242, 169, 0.15);
    }

    .gm-matrix-pill.warn {
      color: var(--g-warning);
      background: rgba(253, 214, 99, 0.06);
      border-color: rgba(253, 214, 99, 0.15);
    }

    .gm-matrix-pill.bad {
      color: var(--g-danger);
      background: rgba(242, 139, 130, 0.06);
      border-color: rgba(242, 139, 130, 0.15);
    }

    .gm-inspector-rule {
      display: flex;
      gap: 6px;
      font-size: 11px;
      color: var(--g-text-subtle);
      line-height: 1.4;
    }

    .gm-inspector-rule::before {
      content: "✦";
      color: var(--g-primary);
    }

    /* Logs Viewport Screen */
    .gm-console-screen {
      border: none;
      background: var(--g-console-bg);

      overflow-y: auto;

      flex-direction: column;
      gap: 6px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);

    .gm-log-row {
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .gm-log-row.success { color: var(--g-success); }
    .gm-log-row.running { color: var(--g-warning); }
    .gm-log-row.failed { color: var(--g-danger); }
    .gm-log-row.muted { color: var(--g-text-subtle); }

    /* Precision Elements & Premium Cockpit Utilities */
    .gm-hud-corners {
      position: relative;
      border-radius: var(--g-radius-card) !important;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.03) !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02), 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .gm-hud-corners::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(0, 242, 196, 0.15) 0%, rgba(138, 180, 248, 0.03) 50%, rgba(0, 242, 196, 0.1) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.5;
      transition: opacity 0.25s ease, background 0.25s ease;
    }

    .gm-hud-corners:hover::before {
      background: linear-gradient(135deg, rgba(0, 242, 196, 0.25) 0%, rgba(138, 180, 248, 0.1) 50%, rgba(0, 242, 196, 0.2) 100%);
      opacity: 1;
    }

    .gm-led {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--g-text-subtle);
      transition: background 0.3s, box-shadow 0.3s;
      flex-shrink: 0;
    }

    .gm-led.ok {
      background: var(--g-success);
      box-shadow: 0 0 8px var(--g-success), 0 0 2px var(--g-success);
      animation: ledPulse 2s infinite ease-in-out;
    }

    .gm-led.warn {
      background: var(--g-warning);
      box-shadow: 0 0 8px var(--g-warning), 0 0 2px var(--g-warning);
      animation: ledPulse 2s infinite ease-in-out;
    }

    .gm-led.danger {
      background: var(--g-danger);
      box-shadow: 0 0 8px var(--g-danger), 0 0 2px var(--g-danger);
      animation: ledFlash 0.8s infinite steps(2);
    }

    @keyframes ledPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    @keyframes ledFlash {
      0% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    .gm-status-lock {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--g-mono);
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--g-primary);
      background: linear-gradient(135deg, rgba(0, 242, 196, 0.1) 0%, rgba(138, 180, 248, 0.03) 100%);
      padding: 2px 8px;
      border-radius: 99px;
      border: 1px solid rgba(0, 242, 196, 0.2);
      box-shadow: 0 0 6px rgba(0, 242, 196, 0.06);
    }

    .gm-signal-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--g-mono);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--g-text-muted);
    }

    .gm-handshake-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
      padding: 8px 0;
      font-family: var(--g-mono);
      font-size: 11px;
    }

    .gm-handshake-row:last-child {
      border-bottom: none;
    }

    .gm-scanline {
      position: relative;
      overflow: hidden;
    }

    .gm-scanline::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to bottom, transparent, rgba(0, 242, 196, 0.015) 50%, transparent 100%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 1;
    }

    .gm-tech-num {
      font-family: var(--g-mono);
      letter-spacing: 0.02em;
    }

    /* Canvas forms & layouts */
    .gm-canvas-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 20px;
      width: 100%;
    }

    @media (min-width: 1500px) {
      .gm-canvas-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
    }

    .gm-canvas-card {
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-top: 1px solid var(--g-line-strong);
      border-radius: var(--g-radius-card);
      padding: 16px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, rgba(255, 255, 255, 0.005) 100%), var(--g-surface-2);
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .gm-canvas-card:hover {
      border-color: rgba(0, 242, 196, 0.2);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .gm-canvas-card b {
      font-size: 13px;
      font-weight: 700;
    }

    .gm-canvas-card small {
      font-size: 11px;
      color: var(--g-text-muted);
      line-height: 1.4;
    }

    .gm-canvas-card p {
      font-size: 11px;
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .gm-canvas-card input[type="checkbox"] {
      accent-color: var(--g-primary);
    }

    .gm-empty-state-banner {
      padding: 24px;
      text-align: center;
      border: 1px dashed rgba(255, 255, 255, 0.05);
      border-radius: var(--g-radius-card);
      background: rgba(255, 255, 255, 0.01);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Reusable Premium Cockpit/Workbench Components */
    .gm-workbench {

      grid-template-columns: 1.65fr 1fr;
      gap: 24px;
      width: 100%;
      flex: 1;

        gap: 16px;

    @media (max-height: 800px) {

        min-height: 440px;

        margin-bottom: 16px;

      }
      .gm-content-pane {
        padding: 16px;

        padding: 12px 24px;

    .gm-workbench-main {

      flex-direction: column;
      gap: 16px;

    }

    .gm-workbench-sidebar {

      flex-direction: column;
      gap: 16px;
      min-height: 0;
    }

      letter-spacing: -0.01em;

      margin-bottom: 8px;

    .gm-status-table {

    .gm-activity-badge {

      font-weight: bold;

    .gm-activity-text {

      overflow: hidden;

      white-space: nowrap;

    .gm-activity-time {

      color: var(--g-text-muted);
      font-size: 10px;

    /* Scrollbars customization */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--g-bg-deep);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--g-surface-3);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--g-line-strong);
    }

    /* Asymmetric grid inside command surface step 2 */
    .gm-command-deck {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .gm-command-deck-status {
      display: flex;
      flex-direction: column;

      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: var(--g-radius-card);
    }

    .gm-command-deck-status span {
      display: flex;
      justify-content: space-between;

    .gm-canvas-split {

      width: 100%;
      flex: 1;

        font-size: 12px !important;
      }
      .gm-status-hub {
        gap: 6px !important;
      }
      .gm-status-pill {
        padding: 2px 8px !important;
        font-size: 10px !important;
      }
    }

    .gm-canvas-main-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;
    }

    .gm-canvas-sidebar-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;
    }

    /* Skeleton animations for waiting states */
    .gm-skeleton-text {
      height: 12px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.02) 25%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.02) 75%);
      background-size: 200% 100%;
      animation: gm-shimmer 1.5s infinite;
      border-radius: 4px;
      display: inline-block;
    }
    .gm-skeleton-bar {
      height: 20px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.02) 25%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.02) 75%);
      background-size: 200% 100%;
      animation: gm-shimmer 1.5s infinite;
      border-radius: 6px;
      width: 100%;
    }
    @keyframes gm-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Tunnel flow animation */
    @keyframes gm-tunnel-flow {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }

      });
      return result;

      if (mod !== "value_added") return subnav[mod] || [];
      const services = state.valueAddedServices || [];
      if (!services.length) return subnav.value_added;
      return services.map(service => [service.service_id, service.title || service.service_id]);

      if (mod === "value_added") {

        state = buildPreviewState();
        refreshAll();
      });

      const container = document.getElementById("workspaceContainer");

        container.classList.remove("collapsed");
        btn.classList.add("active");
        btn.innerText = "隐藏诊断";
      } else {
        container.classList.add("collapsed");
        btn.classList.remove("active");
        btn.innerText = "显示诊断";

      const logsTab = document.getElementById("tab-logs");

      if (tab === 'matrix') {
        matrixTab.classList.add('active');
        logsTab.classList.remove('active');
        matrixContent.classList.remove('hidden');
        logsContent.classList.add('hidden');
      } else {

        logsContent.classList.remove('hidden');

    function renderInspector() {

              ${conclusionLabel}

          </div>

          <div class="gm-inspector-kv">

        </div>
      `;
    }

    function matrixRow(id, name) {
      const d = state.agentMatrix[id] || {};
      const map = v => {
        // Double security guard. If not synced, matrix cells show warning state.
        if (!state.hasSynced) return ["未同步", "warn"];
        if (v === "✓") return ["通过", "ok"];
        if (v === "●") return ["进行", "warn"];
        if (v === "✗") return ["阻断", "bad"];
        return ["未始", ""];
      };

      return `
        <div class="gm-matrix-row">
          <strong>${name}</strong>
          ${["install", "launch", "dialogue", "acceptance", "delivery"].map(k => {
            const m = map(d[k]);
            return `<span class="gm-matrix-pill ${m[1]}">${m[0]}</span>`;
          }).join("")}
        </div>`;
    }

    function onSaveAccountChange() {
      if (!document.getElementById("saveAccount").checked) {
        document.getElementById("rememberPwd").checked = false;
        document.getElementById("autoLogin").checked = false;
      }
    }

    function onRememberPwdChange() {
      if (!document.getElementById("rememberPwd").checked) {
        document.getElementById("autoLogin").checked = false;
      } else {
        document.getElementById("saveAccount").checked = true;
      }
    }

    function onAutoLoginChange() {
      if (document.getElementById("autoLogin").checked) {
        document.getElementById("saveAccount").checked = true;
        document.getElementById("rememberPwd").checked = true;
      }
    }

    function openRegister() {
      const rawInvite = document.getElementById("inviteCode").value.trim();
      window.pywebview.api.build_register_url(rawInvite).then(url => {
        window.pywebview.api.open_url(url);
      });
    }

    function toggleSavedAccountsList(e) {
      e.preventDefault();
      const list = document.getElementById("savedAccountsList");
      list.style.display = list.style.display === "block" ? "none" : "block";
    }

    function populateSavedAccounts() {
      const list = document.getElementById("savedAccountsList");
      if (!list) return;
      const accounts = state.loginAccounts || state.accounts || [];
      list.innerHTML = accounts.length ? accounts.map(a => `
        <div class="gm-saved-row">
          <span>${a.username}</span>
          <button onclick="event.stopPropagation(); removeAccount('${a.username}')">删除</button>
        </div>
      `).join("") : `<div class="gm-saved-row" style="cursor: default; color: var(--g-text-subtle);">暂无历史凭证</div>`;

      list.querySelectorAll(".gm-saved-row span").forEach(node => {
        node.onclick = () => {
          document.getElementById("loginUser").value = node.innerText;
          window.pywebview.api.select_login_account(node.innerText);
          list.style.display = "none";
        };
      });
    }

    function removeAccount(username) {
      window.pywebview.api.remove_login_account(username).then(() => {
        if (state.loginAccounts) {
          state.loginAccounts = state.loginAccounts.filter(a => a.username !== username);
        }
        if (state.accounts) {
          state.accounts = state.accounts.filter(a => a.username !== username);
        }
        populateSavedAccounts();
      });
    }

    function submitLogin() {
      const u = document.getElementById("loginUser").value.trim();
      const p = document.getElementById("loginPass").value.trim();
      if (!u || !p) { alert("请输入账号 and 密码"); return; }
      window.pywebview.api.login(u, p, document.getElementById("rememberPwd").checked, document.getElementById("autoLogin").checked).then(res => {
        if (res && res.success === false) alert(res.message || "登录连接失败");
      });
    }

    function toggleShowKey() {
      const input = document.getElementById("apiKeyVal");
      if (input) input.type = input.type === "password" ? "text" : "password";
    }

    // Preserve pywebview calls for contracts
    function saveApiKey() {
      const val = document.getElementById("apiKeyVal")?.value.trim();
      if (!val) return alert("请输入 API Key");
      window.pywebview.api.save_key(val, document.getElementById("skipKeyTest")?.checked || false);
    }

    function runDiagnosticsCheck() {
      appendPythonLog("正在启动本地系统环境依赖与运行检测...", "running");
      window.pywebview.api.run_env_check();
    }

    function toggleAgentEnabled(id, checked) {
      if (!state.agentEnabled) state.agentEnabled = {};
      state.agentEnabled[id] = checked;
      if (state.selectedAgents) state.selectedAgents[id] = checked;
      window.pywebview.api.toggle_agent(id, checked);
    }

    function setAgentMode(id, mode) {
      window.pywebview.api.set_agent_mode(id, mode);
    }

      const previous = state.communicationSoftwareLink || {};
      const previousState = previous.state || {};
      state.communicationSoftwareLink = {
        ...previous,
        serviceProductId: document.getElementById("cslServiceProductId")?.value || previous.serviceProductId || "",
        agentId: document.getElementById("cslAgentId")?.value || previous.agentId || "codex",
        channel: document.getElementById("cslChannel")?.value || "feishu",
        agentSource: document.getElementById("cslAgentSource")?.value || "existing_local_agent",
        orderId: document.getElementById("cslOrderId")?.value || previous.orderId || "",
        sessionId: document.getElementById("cslSessionId")?.value || previous.sessionId || "",
        platformAccountId: document.getElementById("cslPlatformAccountId")?.value || previous.platformAccountId || "",
        platformChatId: document.getElementById("cslPlatformChatId")?.value || previous.platformChatId || "",
        gatewayMode: document.getElementById("cslGatewayMode")?.value || previous.gatewayMode || "official_bot",
        testPrompt: document.getElementById("cslTestPrompt")?.value || previous.testPrompt || "请回复连接通讯软件验收成功",
        state: {
          ...previousState,
          sourceEventId: document.getElementById("cslSourceEventId")?.value || previousState.sourceEventId || "",
          inboundPlatformMessageId: document.getElementById("cslInboundMessageId")?.value || previousState.inboundPlatformMessageId || "",
          outboundPlatformMessageId: document.getElementById("cslOutboundMessageId")?.value || previousState.outboundPlatformMessageId || "",
          agentResponseDigest: document.getElementById("cslAgentResponseDigest")?.value || previousState.agentResponseDigest || "",
          evidenceUrl: document.getElementById("cslEvidenceUrl")?.value || previousState.evidenceUrl || ""
        }
      };
    }

    window.appendPythonLog = function(line, cls) {
      const el = document.getElementById("logViewport");
      if (!el) return;

      const div = document.createElement("div");
      const lower = String(line).toLowerCase();
      const tone = cls || (
        lower.includes("失败") || lower.includes("error") ? "failed" :
        lower.includes("成功") || lower.includes("ok") || lower.includes("通过") || lower.includes("check ✓") ? "success" :
        lower.includes("正在") || lower.includes("检测") || lower.includes("诊断") || lower.includes("启动") ? "running" :
        "muted"
      );

      div.className = `gm-log-row ${tone}`;
      div.innerText = line;
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
    };

    window.renderLogs = function() {
      const el = document.getElementById("logViewport");
      if (!el) return;
      el.innerHTML = "";
      const active = state.activeModule === "agent" ? parseInt(state.activeSubnav || "1", 10) : 1;
      (logsData[active] || ["[19:40:00] 等待系统发出同步协同握手命令..."]).forEach(line => appendPythonLog(line));
    };
  </script>
