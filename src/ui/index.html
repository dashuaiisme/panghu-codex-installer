<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>胖虎AI客户端</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Share+Tech+Mono&display=swap');

    :root {
      /* Gemini Dark Console Design System - Route F AI Analytics / SaaS Admin Cockpit */
      --g-bg-deep: #04060a;
      --g-bg: #070b12;
      --g-console-bg: #030508;
      --g-surface: #0b101a;
      --g-surface-2: #111726;
      --g-surface-3: #1a2338;
      --g-line: rgba(0, 242, 196, 0.05);
      --g-line-strong: rgba(255, 255, 255, 0.08);

      /* New Audit/Premium Design System Tokens */
      --g-line-glow: rgba(0, 242, 196, 0.15);
      --g-panel-highlight: linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, transparent 100%);
      --g-hairline: 1px solid rgba(255, 255, 255, 0.03);
      --g-scanline: linear-gradient(to bottom, rgba(0, 242, 196, 0.03) 50%, transparent 50%);

      --g-text: #f3f4f6;
      --g-text-inverse: #04060a;
      --g-text-muted: #9ca3af;
      --g-text-subtle: #6b7280;

      --g-primary: #00f2c4; /* Teal-green focus */
      --g-primary-strong: #00b894;
      --g-secondary: #8ab4f8; /* Soft blue support */
      --g-warm: #f6aea9;
      --g-success: #00f2a9;
      --g-warning: #fdd663;
      --g-danger: #f28b82;

      --g-aura: linear-gradient(135deg, #00f2c4 0%, #8ab4f8 52%, #c58af9 100%);
      --g-aura-teal: linear-gradient(135deg, #00f2c4 0%, #00b894 100%);
      --g-shadow-soft: 0 16px 48px rgba(0, 0, 0, 0.7);
      --g-shadow-glow: 0 0 20px rgba(0, 242, 196, 0.12);

      --g-radius-control: 8px;
      --g-radius-card: 12px;
      --g-radius-panel: 16px;

      --g-font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --g-mono: 'Share Tech Mono', Consolas, Monaco, monospace;

      --g-sidebar-width: 250px;
      --g-drawer-height: 290px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      color: var(--g-text);
      font-family: var(--g-font);
      background-color: var(--g-bg);
      position: relative;
    }

    /* Ambient Space Grid (Minimal AI Environment) */
    .gm-space-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-color: var(--g-bg-deep);
      background-image:
        radial-gradient(circle at 10% 10%, rgba(0, 242, 196, 0.05), transparent 45%),
        radial-gradient(circle at 90% 90%, rgba(138, 180, 248, 0.04), transparent 50%),
        radial-gradient(circle at 50% 30%, rgba(197, 138, 249, 0.03), transparent 60%);
      pointer-events: none;
    }

    .gm-space-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 24px 24px;
      opacity: 0.4;
      pointer-events: none;
    }

    .gm-space-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 242, 196, 0.008) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 242, 196, 0.008) 1px, transparent 1px);
      background-size: 80px 80px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    /* Buttons */
    .gm-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      border: 1px solid var(--g-line-strong);
      border-radius: var(--g-radius-control);
      padding: 0 16px;
      color: var(--g-text);
      background: var(--g-surface-2);
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
      gap: 8px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
    }

    .gm-btn:hover {
      border-color: var(--g-primary);
      background: var(--g-surface-3);
      box-shadow: 0 0 12px rgba(0, 242, 196, 0.15);
    }

    .gm-btn:active {
      transform: translateY(0.5px);
    }

    .gm-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: var(--g-line);
      background: var(--g-surface);
      box-shadow: none;
    }

    .gm-btn-primary {
      border: none;
      color: var(--g-text-inverse);
      background: var(--g-aura-teal);
      font-weight: 600;
      box-shadow: var(--g-shadow-glow);
    }

    .gm-btn-primary:hover {
      filter: brightness(1.1);
      box-shadow: 0 0 20px rgba(0, 242, 196, 0.35);
    }

    .gm-glow-btn {
      border: none !important;
      color: var(--g-text-inverse) !important;
      background: var(--g-aura-teal) !important;
      font-weight: 700 !important;
      box-shadow: 0 0 16px rgba(0, 242, 196, 0.3) !important;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .gm-glow-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      transform: translateX(-100%);
      transition: transform 0.8s ease;
    }

    .gm-glow-btn:hover::after {
      transform: translateX(100%);
    }

    .gm-glow-btn:hover {
      box-shadow: 0 0 24px rgba(0, 242, 196, 0.5), 0 0 8px rgba(0, 242, 196, 0.2) !important;
      filter: brightness(1.1);
    }

    .gm-btn-secondary {
      border-color: rgba(0, 242, 196, 0.2);
      color: var(--g-primary);
      background: rgba(0, 242, 196, 0.03);
    }

    .gm-btn-secondary:hover {
      border-color: var(--g-primary);
      background: rgba(0, 242, 196, 0.08);
    }

    .gm-btn-danger {
      border-color: rgba(242, 139, 130, 0.3);
      color: var(--g-danger);
      background: rgba(242, 139, 130, 0.04);
    }

    .gm-btn-danger:hover {
      border-color: var(--g-danger);
      background: rgba(242, 139, 130, 0.08);
    }

    /* Inputs & Selects */
    .gm-input, .gm-select {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--g-line-strong);
      border-radius: var(--g-radius-control);
      padding: 0 14px;
      color: var(--g-text);
      background: var(--g-surface-2);
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
      font-family: inherit;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.2);
    }

    .gm-input:focus, .gm-select:focus {
      border-color: var(--g-primary);
      box-shadow: 0 0 8px rgba(0, 242, 196, 0.2);
      background: var(--g-surface-3);
    }

    .gm-input::placeholder {
      color: var(--g-text-subtle);
    }

    /* Chips */
    .gm-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      color: var(--g-text-muted);
      background: var(--g-surface-2);
      border: 1px solid var(--g-line);
    }

    .gm-chip.ok { color: var(--g-success); border-color: rgba(0, 242, 169, 0.25); background: rgba(0, 242, 169, 0.06); }
    .gm-chip.warn { color: var(--g-warning); border-color: rgba(253, 214, 99, 0.25); background: rgba(253, 214, 99, 0.06); }
    .gm-chip.info { color: var(--g-secondary); border-color: rgba(138, 180, 248, 0.25); background: rgba(138, 180, 248, 0.06); }
    .gm-chip.danger { color: var(--g-danger); border-color: rgba(242, 139, 130, 0.25); background: rgba(242, 139, 130, 0.06); }

    /* Login Gate Layout */
    .gm-login-portal {
      position: relative;
      z-index: 10;
      display: none; /* Controlled by JS */
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .gm-login-card {
      width: min(980px, 95vw);
      min-height: 560px;
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      border-radius: var(--g-radius-panel);
      border: 1px solid var(--g-line);
      border-top: 1px solid var(--g-line-strong);
      background: linear-gradient(135deg, rgba(11, 16, 26, 0.96) 0%, rgba(7, 11, 18, 0.98) 100%);
      box-shadow: var(--g-shadow-soft), inset 0 1px 0 rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(30px);
      overflow: hidden;
      position: relative;
    }

    .gm-login-deco {
      padding: 48px;
      border-right: 1px solid var(--g-line);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: radial-gradient(circle at 20% 20%, rgba(0, 242, 196, 0.08), transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(138, 180, 248, 0.06), transparent 50%);
      position: relative;
      overflow: hidden;
    }

    /* Premium AI Orbit and Aura node */
    .gm-login-aura-core {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 320px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.85;
    }
    .gm-login-aura-core .orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      border: 1px dashed rgba(0, 242, 196, 0.08);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: rotateOrbit 20s linear infinite;
    }
    .gm-login-aura-core .orbit.o1 { width: 260px; height: 260px; animation-duration: 25s; }
    .gm-login-aura-core .orbit.o2 { width: 180px; height: 180px; animation-duration: 15s; animation-direction: reverse; }
    .gm-login-aura-core .orbit.o3 { width: 100px; height: 100px; animation-duration: 8s; }

    .gm-login-aura-core .core-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 70px;
      height: 70px;
      background: var(--g-aura);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      filter: blur(25px);
      opacity: 0.45;
      animation: pulseCore 4s ease-in-out infinite alternate;
    }

    @keyframes rotateOrbit {
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes pulseCore {
      0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.35; }
      100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.65; }
    }

    .gm-brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .gm-logo-spark {
      width: 24px;
      height: 24px;
      background: var(--g-aura);
      clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
      animation: rotateSpark 12s linear infinite;
    }

    @keyframes rotateSpark {
      100% { transform: rotate(360deg); }
    }

    .gm-brand-group h2 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      background: linear-gradient(to right, var(--g-text), var(--g-text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gm-login-desc {
      margin-top: 32px;
      margin-bottom: 32px;
    }

    .gm-login-desc h1 {
      font-size: 26px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      background: var(--g-aura);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gm-login-desc p {
      font-size: 13px;
      line-height: 1.6;
      color: var(--g-text-muted);
    }

    .gm-login-features {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: auto;
    }

    .gm-feature-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11.5px;
      color: var(--g-text-muted);
      background: rgba(255, 255, 255, 0.02);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.01);
      transition: all 0.2s ease;
    }

    .gm-feature-item:hover {
      background: rgba(0, 242, 196, 0.02);
      border-color: rgba(0, 242, 196, 0.1);
      color: var(--g-text);
    }

    .gm-feature-item svg {
      width: 14px;
      height: 14px;
      color: var(--g-primary);
      filter: drop-shadow(0 0 3px rgba(0, 242, 196, 0.3));
    }

    .gm-login-form {
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
    }

    .gm-form-header {
      margin-bottom: 4px;
    }

    .gm-form-header h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .gm-form-header p {
      font-size: 12px;
      color: var(--g-text-subtle);
      margin-top: 2px;
    }

    .gm-form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .gm-form-field label {
      font-size: 11px;
      font-weight: 600;
      color: var(--g-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .gm-account-input-wrapper {
      display: grid;
      grid-template-columns: 1fr 40px;
      gap: 6px;
    }

    .gm-saved-list {
      display: none;
      position: absolute;
      width: calc(50% - 50px);
      right: 40px;
      top: 200px;
      border: 1px solid var(--g-line);
      border-radius: var(--g-radius-control);
      background: var(--g-surface-2);
      z-index: 50;
      max-height: 140px;
      overflow-y: auto;
      box-shadow: var(--g-shadow-soft);
    }

    .gm-saved-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border-bottom: 1px solid var(--g-line);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .gm-saved-row:hover {
      background: var(--g-surface-3);
    }

    .gm-saved-row span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--g-text-muted);
    }

    .gm-saved-row span:hover {
      color: var(--g-text);
    }

    .gm-saved-row button {
      background: transparent;
      border: none;
      color: var(--g-danger);
      font-size: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .gm-form-checkboxes {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .gm-form-checkboxes label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--g-text-muted);
      cursor: pointer;
    }

    .gm-form-checkboxes input[type="checkbox"] {
      accent-color: var(--g-primary);
    }

    .gm-btn:focus-visible,
    .gm-input:focus-visible,
    .gm-select:focus-visible,
    .gm-dock-btn:focus-visible,
    .gm-sidebar-item:focus-visible,
    .gm-saved-row button:focus-visible,
    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--g-primary);
      outline-offset: 3px;
      box-shadow: 0 0 0 4px rgba(0, 242, 196, 0.12);
    }

    .gm-login-links {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      margin-top: 4px;
    }

    .gm-login-links a {
      color: var(--g-primary);
      text-decoration: none;
      transition: color 0.2s;
      cursor: pointer;
    }

    .gm-login-links a:hover {
      color: var(--g-secondary);
    }

    /* Core Application Window Layout (P1: Top-Primary Module Navigation) */
    .gm-cockpit {
      position: relative;
      z-index: 10;
      display: none; /* Controlled by JS */
      width: 100vw;
      height: 100vh;
      flex-direction: column;
      overflow: hidden;
      background: var(--g-bg);
    }

    /* Top Primary Navigation Header */
    .gm-primary-header {
      height: 64px;
      background: rgba(4, 6, 10, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      z-index: 20;
      flex-shrink: 0;
    }

    .gm-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 180px;
    }

    .gm-header-left h2 {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: -0.01em;
      background: var(--g-aura);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .gm-primary-nav {
      display: flex;
      gap: 6px;
      align-items: center;
      height: 100%;
    }

    .gm-dock-btn {
      height: 100%;
      padding: 0 20px;
      border: none;
      background: transparent;
      color: var(--g-text-muted);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .gm-dock-btn:hover {
      color: var(--g-text);
      background: rgba(255, 255, 255, 0.02);
    }

    .gm-dock-btn.active {
      color: var(--g-primary);
      background: linear-gradient(180deg, rgba(0, 242, 196, 0.03) 0%, transparent 100%);
    }

    .gm-dock-btn::before {
      content: "";
      position: absolute;
      bottom: 0;
      left: 15%;
      width: 70%;
      height: 2px;
      background: var(--g-aura-teal);
      opacity: 0;
      transition: all 0.2s ease;
      border-radius: 99px;
      box-shadow: 0 0 10px var(--g-primary);
    }

    .gm-dock-btn.active::before {
      opacity: 1;
    }

    .gm-dock-btn span:first-child {
      font-size: 13px;
      font-weight: 700;
      display: block;
      text-align: center;
      letter-spacing: -0.01em;
    }

    .gm-dock-btn span:last-child {
      font-size: 8px;
      opacity: 0.5;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: block;
      text-align: center;
    }

    .gm-header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 180px;
      justify-content: flex-end;
    }

    /* P1: Modern Status Hub Component in Top Header */
    .gm-status-hub {
      display: flex;
      gap: 16px;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 99px;
      padding: 4px 18px;
      height: 38px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
    }

    .gm-status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--g-text-muted);
    }

    .gm-status-pill strong {
      color: var(--g-text);
      font-weight: 600;
      font-family: var(--g-mono);
    }

    .gm-status-label {
      color: var(--g-text-subtle);
      font-weight: 500;
    }

    .gm-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--g-success);
      box-shadow: 0 0 8px var(--g-success);
    }

    .gm-status-dot.unsynced {
      background: var(--g-warning);
      box-shadow: 0 0 8px var(--g-warning);
    }

    /* Body Area of Cockpit Layout */
    .gm-cockpit-body {
      display: flex;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    /* Contextual Sidebar Navigation (二级子菜单) */
    .gm-context-sidebar {
      width: var(--g-sidebar-width);
      background: var(--g-bg-deep);
      border-right: 1px solid rgba(255, 255, 255, 0.03);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 15;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .gm-sidebar-subnav-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--g-text-subtle);
      margin-bottom: 16px;
      padding-left: 8px;
    }

    /* Right Main Viewport */
    .gm-main-viewport {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-width: 0;
      flex: 1;
      width: auto;
      background: var(--g-bg);
    }

    .gm-viewport-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      background: var(--g-bg-deep);
    }

    .gm-viewport-header h1 {
      font-size: 16px;
      font-weight: 700;
    }

    .gm-viewport-header p {
      font-size: 11px;
      color: var(--g-text-subtle);
      margin-top: 2px;
    }

    /* Stepper segment bar - Kept hidden for contract compatibility */
    .gm-stepper-container {
      display: none !important;
    }

    /* Vertical Contextual Subnav List inside Sidebar */
    .gm-subnav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
      position: relative;
    }

    .gm-subnav-list::before {
      content: "";
      position: absolute;
      left: 27px;
      top: 18px;
      bottom: 18px;
      width: 1px;
      background: rgba(255, 255, 255, 0.04);
      z-index: 0;
      pointer-events: none;
    }

    .gm-timeline-node {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      width: 100%;
      border-radius: var(--g-radius-control);
      background: transparent;
      border: 1px solid transparent;
      color: var(--g-text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
      outline: none;
    }

    .gm-timeline-node:hover {
      background: rgba(255, 255, 255, 0.02);
      color: var(--g-text);
    }

    .gm-timeline-node.active {
      background: linear-gradient(90deg, rgba(0, 242, 196, 0.04) 0%, transparent 100%), var(--g-surface-2);
      border-color: rgba(0, 242, 196, 0.1);
      color: var(--g-text);
      box-shadow: inset 2px 0 0 var(--g-primary);
    }

    .gm-node-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid var(--g-line-strong);
      display: grid;
      place-items: center;
      font-size: 10px;
      font-weight: bold;
      transition: all 0.2s;
      background: var(--g-bg-deep);
      flex-shrink: 0;
      z-index: 2;
    }

    .gm-timeline-node.active .gm-node-dot {
      border-color: var(--g-primary);
      background: var(--g-primary);
      color: var(--g-bg-deep);
      box-shadow: var(--g-shadow-glow);
    }

    .gm-timeline-node.done .gm-node-dot {
      border-color: var(--g-success);
      background: rgba(0, 242, 169, 0.1);
      color: var(--g-success);
    }

    .gm-node-label {
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--g-text-muted);
    }

    .gm-timeline-node.active .gm-node-label {
      color: var(--g-text);
      font-weight: 700;
    }

    .gm-timeline-sep {
      display: none !important;
    }

    /* Bottom collapsible diagnostic drawer workspace layout (P1: Modern HUD style) */
    .gm-workspace-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      position: relative;
    }

    .gm-workspace-container.collapsed .gm-diagnostics-drawer {
      height: 0px;
      border-top: none;
    }

    .gm-content-pane {
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      flex: 1;
      width: 100%;
      max-width: none;
      height: 100%;
    }

    /* Core visual command card */
    .gm-mission-card {
      background: var(--g-surface);
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: var(--g-radius-panel);
      padding: 28px;
      box-shadow: var(--g-shadow-soft);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: none;
      flex: 1;
      min-height: 520px;
    }

    .gm-mission-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: var(--g-aura-teal);
    }

    .gm-mission-header {
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      padding-bottom: 16px;
    }

    .gm-canvas-meta {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--g-primary);
      background: rgba(0, 242, 196, 0.08);
      padding: 2px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 6px;
    }

    .gm-mission-header h2 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-top: 4px;
    }

    .gm-canvas-desc {
      font-size: 12.5px;
      color: var(--g-text-muted);
      line-height: 1.5;
      margin-top: 6px;
    }

    .gm-mission-body {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* Diagnostics Collapsible Drawer - Restructured to Bottom Command Panel */
    .gm-diagnostics-drawer {
      background: var(--g-surface);
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      border-left: none;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: var(--g-drawer-height);
      transition: height 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
    }

    .gm-drawer-tabs {
      display: flex;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      background: var(--g-bg-deep);
    }

    .gm-drawer-tab {
      flex: 1;
      padding: 12px;
      background: transparent;
      border: none;
      color: var(--g-text-subtle);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .gm-drawer-tab:hover {
      color: var(--g-text);
      background: rgba(255, 255, 255, 0.02);
    }

    .gm-drawer-tab.active {
      color: var(--g-primary);
      border-bottom-color: var(--g-primary);
      background: rgba(255, 255, 255, 0.01);
    }

    .gm-drawer-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .gm-drawer-content.scrollable {
      overflow-y: auto;
    }

    .gm-drawer-content.hidden {
      display: none !important;
    }

    /* Diagnostics Area Style (P1: Modern Asymmetric Grid) */
    #deliveryInspector {
      padding: 20px 24px;
      display: grid;
      grid-template-columns: 1.2fr 2fr 1.5fr;
      gap: 24px;
    }

    .gm-inspector-col {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }

    .gm-inspector-col h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--g-text-subtle);
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      padding-bottom: 6px;
      margin-bottom: 8px;
    }

    .gm-inspector-kv {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .gm-inspector-kv div {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.01);
      font-family: var(--g-mono);
    }

    .gm-inspector-kv span:first-child {
      color: var(--g-text-subtle);
    }

    .gm-inspector-kv span:last-child {
      font-weight: 500;
      color: var(--g-text-muted);
    }

    .gm-matrix {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .gm-matrix-header {
      display: grid;
      grid-template-columns: 90px repeat(5, 1fr);
      font-size: 9px;
      font-weight: bold;
      color: var(--g-text-subtle);
      text-align: center;
      margin-bottom: 2px;
    }

    .gm-matrix-header span:first-child {
      text-align: left;
    }

    .gm-matrix-row {
      display: grid;
      grid-template-columns: 90px repeat(5, 1fr);
      align-items: center;
      gap: 4px;
    }

    .gm-matrix-row strong {
      font-size: 11px;
      color: var(--g-text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .gm-matrix-pill {
      height: 18px;
      border-radius: 4px;
      font-size: 9px;
      font-weight: bold;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--g-text-subtle);
      background: rgba(255, 255, 255, 0.01);
      font-family: var(--g-mono);
    }

    .gm-matrix-pill.ok {
      color: var(--g-success);
      background: rgba(0, 242, 169, 0.06);
      border-color: rgba(0, 242, 169, 0.15);
    }

    .gm-matrix-pill.warn {
      color: var(--g-warning);
      background: rgba(253, 214, 99, 0.06);
      border-color: rgba(253, 214, 99, 0.15);
    }

    .gm-matrix-pill.bad {
      color: var(--g-danger);
      background: rgba(242, 139, 130, 0.06);
      border-color: rgba(242, 139, 130, 0.15);
    }

    .gm-inspector-rule {
      display: flex;
      gap: 6px;
      font-size: 11px;
      color: var(--g-text-subtle);
      line-height: 1.4;
    }

    .gm-inspector-rule::before {
      content: "✦";
      color: var(--g-primary);
    }

    /* Logs Viewport Screen */
    .gm-console-screen {
      border: none;
      background: var(--g-console-bg);
      padding: 12px;
      overflow-y: auto;
      font-family: var(--g-mono);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
    }

    .gm-log-row {
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .gm-log-row.success { color: var(--g-success); }
    .gm-log-row.running { color: var(--g-warning); }
    .gm-log-row.failed { color: var(--g-danger); }
    .gm-log-row.muted { color: var(--g-text-subtle); }

    /* Precision Elements & Premium Cockpit Utilities */
    .gm-hud-corners {
      position: relative;
      border-radius: var(--g-radius-card) !important;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      border: 1px solid rgba(255, 255, 255, 0.03) !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02), 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .gm-hud-corners::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg, rgba(0, 242, 196, 0.15) 0%, rgba(138, 180, 248, 0.03) 50%, rgba(0, 242, 196, 0.1) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.5;
      transition: opacity 0.25s ease, background 0.25s ease;
    }

    .gm-hud-corners:hover::before {
      background: linear-gradient(135deg, rgba(0, 242, 196, 0.25) 0%, rgba(138, 180, 248, 0.1) 50%, rgba(0, 242, 196, 0.2) 100%);
      opacity: 1;
    }

    .gm-led {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--g-text-subtle);
      transition: background 0.3s, box-shadow 0.3s;
      flex-shrink: 0;
    }

    .gm-led.ok {
      background: var(--g-success);
      box-shadow: 0 0 8px var(--g-success), 0 0 2px var(--g-success);
      animation: ledPulse 2s infinite ease-in-out;
    }

    .gm-led.warn {
      background: var(--g-warning);
      box-shadow: 0 0 8px var(--g-warning), 0 0 2px var(--g-warning);
      animation: ledPulse 2s infinite ease-in-out;
    }

    .gm-led.danger {
      background: var(--g-danger);
      box-shadow: 0 0 8px var(--g-danger), 0 0 2px var(--g-danger);
      animation: ledFlash 0.8s infinite steps(2);
    }

    @keyframes ledPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    @keyframes ledFlash {
      0% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    .gm-status-lock {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--g-mono);
      font-size: 9.5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--g-primary);
      background: linear-gradient(135deg, rgba(0, 242, 196, 0.1) 0%, rgba(138, 180, 248, 0.03) 100%);
      padding: 2px 8px;
      border-radius: 99px;
      border: 1px solid rgba(0, 242, 196, 0.2);
      box-shadow: 0 0 6px rgba(0, 242, 196, 0.06);
    }

    .gm-signal-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--g-mono);
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--g-text-muted);
    }

    .gm-handshake-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
      padding: 8px 0;
      font-family: var(--g-mono);
      font-size: 11px;
    }

    .gm-handshake-row:last-child {
      border-bottom: none;
    }

    .gm-scanline {
      position: relative;
      overflow: hidden;
    }

    .gm-scanline::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(to bottom, transparent, rgba(0, 242, 196, 0.015) 50%, transparent 100%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 1;
    }

    .gm-tech-num {
      font-family: var(--g-mono);
      letter-spacing: 0.02em;
    }

    /* Canvas forms & layouts */
    .gm-canvas-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 20px;
      width: 100%;
    }

    @media (min-width: 1500px) {
      .gm-canvas-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
      }
    }

    .gm-canvas-card {
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-top: 1px solid var(--g-line-strong);
      border-radius: var(--g-radius-card);
      padding: 16px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02) 0%, rgba(255, 255, 255, 0.005) 100%), var(--g-surface-2);
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .gm-canvas-card:hover {
      border-color: rgba(0, 242, 196, 0.2);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .gm-canvas-card b {
      font-size: 13px;
      font-weight: 700;
    }

    .gm-canvas-card small {
      font-size: 11px;
      color: var(--g-text-muted);
      line-height: 1.4;
    }

    .gm-canvas-card p {
      font-size: 11px;
      margin-top: auto;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .gm-canvas-card input[type="checkbox"] {
      accent-color: var(--g-primary);
    }

    .gm-empty-state-banner {
      padding: 24px;
      text-align: center;
      border: 1px dashed rgba(255, 255, 255, 0.05);
      border-radius: var(--g-radius-card);
      background: rgba(255, 255, 255, 0.01);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Reusable Premium Cockpit/Workbench Components */
    .gm-workbench {
      display: grid;
      grid-template-columns: 1.65fr 1fr;
      gap: 24px;
      width: 100%;
      flex: 1;
    }

    @media (max-width: 1366px) {
      .gm-workbench {
        grid-template-columns: 1.35fr 1fr;
        gap: 16px;
      }
    }

    @media (max-height: 800px) {
      .gm-mission-card {
        min-height: 440px;
        padding: 16px 20px;
      }
      .gm-mission-header {
        margin-bottom: 16px;
        padding-bottom: 12px;
      }
      .gm-content-pane {
        padding: 16px;
      }
      .gm-viewport-header {
        padding: 12px 24px;
      }
      .gm-primary-header {
        height: 56px;
      }
    }

    .gm-workbench-main {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;
    }

    .gm-workbench-sidebar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;
    }

    .gm-workbench-sidebar b {
      font-size: 13px;
      color: var(--g-primary);
      letter-spacing: -0.01em;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      padding-bottom: 6px;
      display: block;
      margin-bottom: 8px;
    }

    .gm-status-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      color: var(--g-text-muted);
    }

    .gm-status-table td {
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
    }

    .gm-status-table tr:last-child td {
      border-bottom: none;
    }

    .gm-status-table td:last-child {
      text-align: right;
      font-weight: 700;
      color: var(--g-text);
    }

    .gm-status-table td.ok { color: var(--g-success); }
    .gm-status-table td.warn { color: var(--g-warning); }

    .gm-activity-strip {
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: var(--g-radius-control);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 11px;
      margin-top: 12px;
      width: 100%;
    }

    .gm-activity-badge {
      font-size: 9px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(0, 242, 196, 0.1);
      color: var(--g-primary);
    }

    .gm-activity-text {
      color: var(--g-text-subtle);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .gm-activity-time {
      font-family: var(--g-mono);
      color: var(--g-text-muted);
      font-size: 10px;
    }

    /* Scrollbars customization */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--g-bg-deep);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--g-surface-3);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--g-line-strong);
    }

    /* Asymmetric grid inside command surface step 2 */
    .gm-command-deck {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .gm-command-deck-status {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      background: var(--g-surface-2);
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: var(--g-radius-card);
    }

    .gm-command-deck-status span {
      display: flex;
      justify-content: space-between;
      font-size: 11.5px;
    }

    .gm-command-deck-status label {
      color: var(--g-text-subtle);
    }

    /* Agent Center and dynamic split layouts */
    .gm-canvas-split {
      display: grid;
      grid-template-columns: 1.65fr 1fr;
      gap: 24px;
      width: 100%;
      flex: 1;
      min-height: 0;
    }

    @media (max-width: 1366px) {
      .gm-canvas-split {
        grid-template-columns: 1.35fr 1fr;
        gap: 16px;
      }
      :root {
        --g-sidebar-width: 210px !important;
      }
      .gm-context-sidebar {
        padding: 16px 12px !important;
      }
      .gm-btn {
        min-height: 34px !important;
        padding: 0 12px !important;
        font-size: 11px !important;
      }
      .gm-primary-nav {
        gap: 10px !important;
      }
      .gm-primary-nav .nav-item {
        padding: 6px 10px !important;
        font-size: 12px !important;
      }
      .gm-status-hub {
        gap: 6px !important;
      }
      .gm-status-pill {
        padding: 2px 8px !important;
        font-size: 10px !important;
      }
    }

    .gm-canvas-main-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;
    }

    .gm-canvas-sidebar-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 0;
    }

    /* Skeleton animations for waiting states */
    .gm-skeleton-text {
      height: 12px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.02) 25%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.02) 75%);
      background-size: 200% 100%;
      animation: gm-shimmer 1.5s infinite;
      border-radius: 4px;
      display: inline-block;
    }
    .gm-skeleton-bar {
      height: 20px;
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.02) 25%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.02) 75%);
      background-size: 200% 100%;
      animation: gm-shimmer 1.5s infinite;
      border-radius: 6px;
      width: 100%;
    }
    @keyframes gm-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Tunnel flow animation */
    @keyframes gm-tunnel-flow {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  /* ===== COCKPIT REFRESH v4.2 (scoped .gm-cockpit) ===== */
  .gm-cockpit{ --g-text-subtle:#8b95a6; --g-text-muted:#c2cbd8; }
  .gm-cockpit .gm-content-pane{ justify-content:flex-start; }
  .gm-cockpit .gm-mission-card{ flex:0 0 auto; min-height:0; }
  /* 防止双栏 grid 子项被内容撑破容器导致右栏溢出被截 */
  .gm-cockpit .gm-workbench>*, .gm-cockpit .gm-canvas-split>*,
  .gm-cockpit .gm-workbench-main, .gm-cockpit .gm-workbench-sidebar,
  .gm-cockpit .gm-canvas-main-col, .gm-cockpit .gm-canvas-sidebar-col{ min-width:0; }

  /* ===== 多格式 Key 界面 (step 1) ===== */

      // 用真实完成信号判断步骤是否完成，取代"编号 < 当前步"的假勾。
      const keyOk = !!state.savedKeyOk;
      const envOk = !!state.environmentOk;
      const agentsSelected = Object.values(state.agentEnabled || {}).some(Boolean);
      if (n === 1) return keyOk;
      if (n === 2) return keyOk && envOk;
      if (n === 3) return keyOk && envOk && agentsSelected;
      // 第 4 步起(安装/写配置/验收)后端未暴露逐步完成标志：仅当前 3 步真实完成、
      // 且已导航越过该步时才显示已完成，避免在前置步骤没做时就打勾。
      const prereqOk = keyOk && envOk && agentsSelected;
      return prereqOk && Number(n) < Number(state.currentStep || state.activeSubnav || 1);
    }

          const meta = DRIFT_META[a.level] || DRIFT_META.ok;

      return `<table class="gm-status-table">` + eps.map(e => {
        const ok = e.reachable;
        const val = ok ? `${e.latency_ms} ms` : "不可达";
        const color = ok ? (e.latency_ms < 300 ? "#00f2a9" : "#fdd663") : "#f28b82";
        const rec = e.id === lat.recommended_id ? ` <span class="gm-tech-num" style="background:rgba(0,242,169,.12);color:#00f2a9;padding:1px 6px;border-radius:6px">推荐</span>` : "";
        return `<tr class="gm-handshake-row"><td>${e.label || e.id}</td><td style="color:${color}">${val}${rec}</td></tr>`;
      }).join("") + `</table>`;

    function runLatencyTest() {
      ensureConfigHealth();
      appendPythonLog("正在测试网关线路延迟……", "running");

        if (r && r.success) { state.configHealth.latency = r.result; appendPythonLog("网关测速完成。", "success"); }
        else { appendPythonLog("测速失败：" + ((r&&r.message)||""), "error"); }
        refreshAll();
      });

    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
    function safeHttpUrl(s) {
      const u = String(s == null ? "" : s).trim();
      return /^https?:\/\//i.test(u) ? u : "";
    }
    function jsStringInAttr(s) {
      // 供内联 on* 属性里的单引号 JS 字符串使用：先做 JS 转义(反斜杠/单引号)，
      // 再对可能破坏双引号 HTML 属性的字符做 HTML 转义。
      return String(s == null ? "" : s)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/[\r\n]+/g, " ");
    }

    function matrixRow(id, name) {
      const d = state.agentMatrix[id] || {};
      const map = v => {
        // Double security guard. If not synced, matrix cells show warning state.
        if (!state.hasSynced) return ["未同步", "warn"];
        if (v === "✓") return ["通过", "ok"];
        if (v === "●") return ["进行", "warn"];
        if (v === "✗") return ["阻断", "bad"];
        return ["未始", ""];
      };

      return `
        <div class="gm-matrix-row">
          <strong>${name}</strong>
          ${["install", "launch", "dialogue", "acceptance", "delivery"].map(k => {
            const m = map(d[k]);
            return `<span class="gm-matrix-pill ${m[1]}">${m[0]}</span>`;
          }).join("")}
        </div>`;
    }

    function onSaveAccountChange() {
      if (!document.getElementById("saveAccount").checked) {
        document.getElementById("rememberPwd").checked = false;
        document.getElementById("autoLogin").checked = false;
      }
    }

    function onRememberPwdChange() {
      if (!document.getElementById("rememberPwd").checked) {
        document.getElementById("autoLogin").checked = false;
      } else {
        document.getElementById("saveAccount").checked = true;
      }
    }

    function onAutoLoginChange() {
      if (document.getElementById("autoLogin").checked) {
        document.getElementById("saveAccount").checked = true;
        document.getElementById("rememberPwd").checked = true;
      }
    }

    function setLoginStatus(msg, level) {
      const el = document.getElementById("loginStatus");
      if (!el) return;
      if (!msg) { el.style.display = "none"; return; }
      const colors = {
        info: ["rgba(138,180,248,.12)", "#8ab4f8"], running: ["rgba(253,214,99,.12)", "#fdd663"],
        error: ["rgba(242,139,130,.12)", "#f28b82"], success: ["rgba(0,242,169,.12)", "#00f2a9"]
      };
      const c = colors[level] || colors.info;
      el.style.background = c[0]; el.style.color = c[1];
      el.textContent = msg; el.style.display = "block";
    }
    // 供 Python 后台线程回调（成功切界面，失败/进度在登录页显示）
    window.setLoginStatus = setLoginStatus;
    // 全局 toast：登录页显示在状态条，登录后显示为右上角浮动提示。
    // Python 侧 notify_user/push_webview_toast 的所有客户提示都走这里。
    window.showToast = function(msg, level) {
      const gate = document.getElementById("loginGate");
      if (gate && getComputedStyle(gate).display !== "none") { setLoginStatus(msg, level); return; }
      let host = document.getElementById("gmToastHost");
      if (!host) {
        host = document.createElement("div");
        host.id = "gmToastHost";
        host.style.cssText = "position:fixed;top:64px;right:20px;z-index:99999;display:flex;flex-direction:column;gap:8px;max-width:420px;pointer-events:none;";
        document.body.appendChild(host);
      }
      const colors = {
        info: ["rgba(138,180,248,.12)", "#8ab4f8"], running: ["rgba(253,214,99,.12)", "#fdd663"],
        warning: ["rgba(253,214,99,.12)", "#fdd663"],
        error: ["rgba(242,139,130,.12)", "#f28b82"], success: ["rgba(0,242,169,.12)", "#00f2a9"]
      };
      const c = colors[level] || colors.info;
      const item = document.createElement("div");
      item.style.cssText = "background:" + c[0] + ";color:" + c[1] + ";padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.5;box-shadow:0 4px 16px rgba(0,0,0,.35);word-break:break-word;";
      item.textContent = msg;
      host.appendChild(item);
      while (host.children.length > 5) host.removeChild(host.firstChild);
      setTimeout(() => { item.remove(); }, 6000);
    };

    function submitLogin() {
      const username = (document.getElementById("loginUser").value || "").trim();
      const password = document.getElementById("loginPass").value || "";
      if (!username || !password) {
        setLoginStatus("请输入账号和密码后再登录。", "error");
        return;
      }
      const rememberPwd = !!(document.getElementById("rememberPwd") && document.getElementById("rememberPwd").checked);
      const autoLogin = !!(document.getElementById("autoLogin") && document.getElementById("autoLogin").checked);
      setLoginStatus("正在登录胖虎AI，请稍候……", "running");
      const btn = document.querySelector('#loginGate .gm-btn-primary');
      if (btn) { btn.disabled = true; }
      Promise.resolve(window.pywebview.api.login(username, password, rememberPwd, autoLogin))
        .then(res => {
          if (res && res.success === false) {
            setLoginStatus("登录失败：" + (res.message || "请检查账号密码"), "error");
          }
          // pending:true 时结果由后台线程通过 setLoginStatus / 切界面反映
        })
        .catch(err => { setLoginStatus("登录出错：" + err, "error"); })
        .finally(() => { if (btn) { btn.disabled = false; } });
    }

    function openRegister() {
      const rawInvite = document.getElementById("inviteCode").value.trim();
      window.pywebview.api.build_register_url(rawInvite).then(url => {
        window.pywebview.api.open_url(url);
      });
    }

    function toggleSavedAccountsList(e) {
      e.preventDefault();
      const list = document.getElementById("savedAccountsList");
      list.style.display = list.style.display === "block" ? "none" : "block";
    }

    function populateSavedAccounts() {
      const list = document.getElementById("savedAccountsList");
      if (!list) return;
      const accounts = state.loginAccounts || state.accounts || [];
      list.innerHTML = accounts.length ? accounts.map(a => `
        <div class="gm-saved-row">
          <span>${a.username}</span>
          <button onclick="event.stopPropagation(); removeAccount('${a.username}')">删除</button>
        </div>
      `).join("") : `<div class="gm-saved-row" style="cursor: default; color: var(--g-text-subtle);">暂无历史凭证</div>`;

      list.querySelectorAll(".gm-saved-row span").forEach(node => {
        node.onclick = () => {
          document.getElementById("loginUser").value = node.innerText;
          window.pywebview.api.select_login_account(node.innerText);
          list.style.display = "none";
        };
      });
    }

    function removeAccount(username) {
      window.pywebview.api.remove_login_account(username).then(() => {
        if (state.loginAccounts) {
          state.loginAccounts = state.loginAccounts.filter(a => a.username !== username);
        }
        if (state.accounts) {
          state.accounts = state.accounts.filter(a => a.username !== username);
        }
        populateSavedAccounts();
      });
    }

    // 旧版 submitLogin（Codex 遗留，alert 版）已删除：函数声明重复时后者覆盖前者，
    // 曾导致上方带 loginStatus 反馈的正式版 submitLogin 永远不生效（登录"无反应"根因）。

    function toggleShowKey(id) {
      const input = document.getElementById(id || "key_openai");
      if (input) input.type = input.type === "password" ? "text" : "password";
    }

    const KEY_FORMATS = [
      { id:"openai", name:"OpenAI 兼容格式", short:"给 Codex / OpenClaw / Hermes 用", agents:["Codex","OpenClaw","Hermes"], model:"gpt-5.5", modelHint:"如 gpt-5.5",
        help:"Codex、OpenClaw、Hermes 这几个 AI 助手都用 OpenAI 的接口格式，彼此通用，所以共用同一把「OpenAI 兼容格式」的 Key。在 aitokenapi.cc 创建这种格式的 Key 填这里就行。把别的格式的 Key 填这里会跑不通。" },
      { id:"anthropic", name:"Anthropic 格式", short:"给 Claude Code 用", agents:["Claude Code"], model:"claude-opus-4-8", modelHint:"如 claude-opus-4-8",

      { id:"gemini", name:"Gemini 格式", short:"给 Gemini 用", agents:["Gemini / agy"], model:"gemini-3.5", modelHint:"如 gemini-3.5",
        help:"Gemini（agy）用的是 Google Gemini 的接口格式，和前两种都不通用，需要单独一把 Gemini 格式的 Key。" },

          <summary class="gm-kg-summary">

    // Preserve pywebview calls for contracts
    function saveApiKey() {
      const keys = {}, models = {};
      (KEY_FORMATS || []).forEach(g => {
        keys[g.id] = (document.getElementById("key_" + g.id)?.value || "").trim();
        models[g.id] = (document.getElementById("model_" + g.id)?.value || "").trim();
      });
      if (!Object.values(keys).some(v => v)) { window.showToast("请至少填写一种格式的 API Key", "warning"); return; }
      window.showToast("正在校验并保存 Key……", "running");
      const payload = { keys, models, skip_test: document.getElementById("skipKeyTest")?.checked || false };
      Promise.resolve(window.pywebview.api.save_key(payload))
        .then(res => {
          if (res && res.success) { window.showToast(res.message || "Key 已保存", "success"); }
          else { window.showToast("Key 保存失败：" + ((res && res.message) || "未知原因"), "error"); }
        })
        .catch(err => window.showToast("Key 保存出错：" + err, "error"));
    }

    function runDiagnosticsCheck() {

      window.pywebview.api.run_env_check();

    function refreshEntitlements() {
      window.showToast("正在刷新你的权益……", "running");
      Promise.resolve(window.pywebview.api.buyer_refresh_entitlements())
        .then(res => {
          if (res && res.success) { window.showToast(res.message || "权益已刷新，可继续安装", "success"); }
          else { window.showToast("刷新权益失败：" + ((res && res.message) || "请稍后再试"), "error"); }
        })
        .catch(err => window.showToast("刷新权益出错：" + err, "error"));
    }

    // 客户端内直接付款：创建订单 → 弹二维码（服务端返回支付宝 WAP 链接，本地生成二维码）
    // → 手机支付宝扫码 → 轮询支付状态 → 到账后刷新权益。
    function payInAppWithQr() {
      window.showToast("正在创建订单……", "running");
      Promise.resolve(window.pywebview.api.buyer_create_payment_order())
        .then(res => {
          if (res && res.success) {
            showPaymentQrModal(res.order_id, res.payment_url, res.qr_data_url, res.message);
          } else {
            window.showToast("创建订单失败：" + ((res && res.message) || "请稍后再试"), "error");
          }
        })
        .catch(err => window.showToast("创建订单出错：" + err, "error"));
    }

    let paymentPollTimer = null;
    function showPaymentQrModal(orderId, paymentUrl, qrDataUrl, message) {
      closePaymentQrModal();
      // 安全：orderId/message/qrDataUrl 来自服务端响应，一律走 textContent / img.src /
      // addEventListener 闭包，绝不拼进 innerHTML 或 onclick 字符串，避免 XSS 注入。
      const overlay = document.createElement("div");
      overlay.id = "gmPayModal";
      overlay.style.cssText = "position:fixed;inset:0;z-index:100000;background:rgba(4,10,20,.72);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);";
      const card = document.createElement("div");
      card.style.cssText = "background:#0d1526;border:1px solid rgba(0,242,169,.25);border-radius:14px;padding:24px;max-width:360px;width:90%;text-align:center;box-shadow:0 12px 48px rgba(0,0,0,.5);";

      const title = document.createElement("div");
      title.style.cssText = "font-size:16px;color:#e6edf7;margin-bottom:4px;";
      title.textContent = "支付宝扫码付款";
      const sub = document.createElement("div");
      sub.style.cssText = "font-size:12px;color:#8aa0bd;margin-bottom:16px;";
      sub.textContent = "请用手机支付宝扫描下面的二维码完成付款";
      card.appendChild(title);
      card.appendChild(sub);

      if (qrDataUrl && String(qrDataUrl).slice(0, 22) === "data:image/png;base64,") {
        const img = document.createElement("img");
        img.alt = "支付二维码";
        img.style.cssText = "width:220px;height:220px;background:#fff;padding:10px;border-radius:10px;";
        img.src = qrDataUrl; // 仅接受后端本地生成的 data:image/png，杜绝其它协议
        card.appendChild(img);
      } else {
        const fail = document.createElement("div");
        fail.style.cssText = "color:#f28b82;font-size:13px;line-height:1.6;";
        fail.textContent = "二维码生成失败。请复制订单号联系后台，或稍后重试。";
        card.appendChild(fail);
      }

      const oid = document.createElement("div");
      oid.style.cssText = "font-size:12px;color:#8aa0bd;margin:14px 0 6px;word-break:break-all;";
      oid.textContent = "订单号：" + (orderId || "-");
      card.appendChild(oid);

      const actions = document.createElement("div");
      actions.style.cssText = "display:flex;gap:10px;justify-content:center;margin-top:12px;";
      const queryBtn = document.createElement("button");
      queryBtn.className = "gm-btn";
      queryBtn.textContent = "我已付款，查询结果";
      queryBtn.addEventListener("click", () => queryPaymentOnce(orderId, false));
      const closeBtn = document.createElement("button");
      closeBtn.className = "gm-btn gm-btn-secondary";
      closeBtn.textContent = "关闭";
      closeBtn.addEventListener("click", closePaymentQrModal);
      actions.appendChild(queryBtn);
      actions.appendChild(closeBtn);
      card.appendChild(actions);

      const status = document.createElement("div");
      status.id = "gmPayStatus";
      status.style.cssText = "font-size:12px;color:#8aa0bd;margin-top:12px;line-height:1.6;";
      status.textContent = message || "付款后点“查询结果”。";
      card.appendChild(status);

      overlay.appendChild(card);
      document.body.appendChild(overlay);
      // 自动轮询（约每 4 秒一次，最多 ~5 分钟）；付款成功自动关闭并刷新权益。
      let attempts = 0;
      paymentPollTimer = setInterval(() => {
        attempts += 1;
        if (attempts > 75) { clearInterval(paymentPollTimer); paymentPollTimer = null; return; }
        queryPaymentOnce(orderId, true);
      }, 4000);
    }

    function closePaymentQrModal() {
      if (paymentPollTimer) { clearInterval(paymentPollTimer); paymentPollTimer = null; }
      const el = document.getElementById("gmPayModal");
      if (el) el.remove();
    }

    function queryPaymentOnce(orderId, silent) {
      const statusEl = document.getElementById("gmPayStatus");
      if (statusEl && !silent) statusEl.textContent = "正在查询支付状态……";
      Promise.resolve(window.pywebview.api.buyer_query_payment_status(orderId))
        .then(res => {
          if (!res || !res.success) {
            if (statusEl) statusEl.textContent = "查询失败：" + ((res && res.message) || "请稍后再试");
            return;
          }
          if (res.ready_for_delivery) {
            closePaymentQrModal();
            window.showToast("支付成功，权益已到账，正在刷新权益……", "success");
            refreshEntitlements();
          } else if (statusEl) {
            statusEl.textContent = res.message || "支付尚未完成，请扫码付款后再查询。";
          }
        })
        .catch(err => { if (statusEl) statusEl.textContent = "查询出错：" + err; });
    }

    window.appendPythonLog = function(line, cls) {
      const el = document.getElementById("logViewport");
      if (!el) return;

      // 后端推送的实时/历史日志是 {t,c,m} 对象（t=时间, c=log-text-* 样式, m=文本）；
      // 也兼容纯字符串（浏览器预览桩）。之前把对象直接当字符串 → 满屏 [object Object]，
      // 买家点安装/写配置后看不到任何真实结果。
      let text, tone = cls;
      if (line && typeof line === "object") {
        text = (line.t ? "[" + line.t + "] " : "") + (line.m == null ? "" : line.m);
        if (!tone) {
          tone = { "log-text-bad": "failed", "log-text-ok": "success", "log-text-run": "running", "log-text-info": "muted" }[line.c] || "muted";
        }
      } else {
        text = String(line);
      }

      const lower = text.toLowerCase();
      const finalTone = tone || (
        lower.includes("失败") || lower.includes("error") ? "failed" :
        lower.includes("成功") || lower.includes("ok") || lower.includes("通过") || lower.includes("check ✓") ? "success" :
        lower.includes("正在") || lower.includes("检测") || lower.includes("诊断") || lower.includes("启动") ? "running" :
        "muted"
      );

      const div = document.createElement("div");
      div.className = `gm-log-row ${finalTone}`;
      div.innerText = text;
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
    };

    window.renderLogs = function() {
      const el = document.getElementById("logViewport");
      if (!el) return;
      el.innerHTML = "";
      const active = state.activeModule === "agent" ? parseInt(state.activeSubnav || "1", 10) : 1;
      const rows = (logsData[active] && logsData[active].length) ? logsData[active] : ["[--:--:--] 暂无日志。"];
      rows.forEach(line => appendPythonLog(line));
    };
